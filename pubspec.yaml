name: task_flow
description: "Projects and task management application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_secure_storage: ^10.0.0
  loading_animation_widget:
  google_fonts: ^8.0.1
  intl: ^0.20.2
  http: ^1.5.0
  dropdown_button2: ^3.1.0
  flutter_svg: ^2.1.0
  path_provider: ^2.1.5
  http_parser: ^4.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:

  uses-material-design: true

  assets:
    - assets/mock_data/mock-data.json
    - assets/images/png/
